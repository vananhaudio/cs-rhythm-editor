# Netlify — cấu hình build & Edge Function
# Trước đây không có file này (Netlify tự nhận Vite).

[build]
  # GATE: thẻ chia sẻ (Universal OG) + phủ route chạy TRƯỚC build. test:og FAIL → build FAIL → không deploy.
  # Chỉ ở Netlify; build ở máy (npm run build) không đổi.
  command = "npm run test:og && npm run build"
  publish = "dist"

# Universal OG: MỘT Edge Function cho mọi trang — netlify/edge-functions/og.ts (path + excludedPath khai
# ngay trong file, export config). Không còn danh sách route OG ở đây.

# Deploy preview của Pull Request dùng cùng backend hợp âm (RPC → production Supabase) như production.
# Thiếu dòng này, build preview rơi vào chế độ "disabled" (biến chỉ đặt cho context production trên Netlify).
[context.deploy-preview.environment]
  VITE_CHORD_LIBRARY_BACKEND = "rpc"
