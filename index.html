<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />

    <!-- PWA / Home Screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TVA Guitar" />
    <meta name="theme-color" content="#4338CA" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font nhạc chuẩn SMuFL (dấu lặng, ký hiệu nhạc) -->
    <link rel="preload" href="/font/Bravura.woff2" as="font" type="font/woff2" crossorigin />
    <style>@font-face{font-family:'Bravura';src:url('/font/Bravura.woff2') format('woff2'),url('/font/Bravura.woff') format('woff');font-display:block}</style>

    <!-- Cache: để service worker tự quản lý, không block hoàn toàn -->
    <meta http-equiv="Cache-Control" content="no-cache" />

    <title>Thầy Văn Anh Guitar – Học Guitar Văn Anh | Lớp học chính thức</title>
    <meta name="description" content="Học guitar cùng Thầy Văn Anh — lộ trình rõ ràng, luyện tập mỗi ngày, và 1001 Câu chuyện cùng Guitar của cộng đồng." />

    <!-- Thẻ chia sẻ mạng xã hội (Zalo, Facebook, Messenger…) — MẶC ĐỊNH Class.
         Universal OG (netlify/edge-functions/og.ts) ghi đè cho mọi resource công khai (Band, Lớp, Buổi,
         Story, Showcase, Tool, landing) và luôn sửa og:url về đúng URL. Giữ đủ các thẻ dưới đây. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thầy Văn Anh Guitar" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Thầy Văn Anh Guitar" />
    <meta property="og:description" content="Học guitar cùng Thầy Văn Anh — lộ trình rõ ràng, luyện tập mỗi ngày, và 1001 Câu chuyện cùng Guitar của cộng đồng." />
    <meta property="og:image" content="https://class.vananhaudio.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://class.vananhaudio.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thầy Văn Anh Guitar" />
    <meta name="twitter:description" content="Học guitar cùng Thầy Văn Anh — lộ trình rõ ràng, luyện tập mỗi ngày, và 1001 Câu chuyện cùng Guitar của cộng đồng." />
    <meta name="twitter:image" content="https://class.vananhaudio.com/og-default.png" />

    <!-- SEO thương hiệu: tên site + tên gọi khác cho Google. Canonical KHÔNG đặt ở đây (file dùng chung mọi
         route của SPA) — Edge Function og.ts chèn canonical đúng từng URL (netlify/og/render.ts).
         sameAs chỉ ghi kênh chính thức đã xác minh; thêm Facebook/YouTube khi Owner cung cấp link. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://class.vananhaudio.com/#website",
          "url": "https://class.vananhaudio.com/",
          "name": "Thầy Văn Anh Guitar",
          "alternateName": ["Học Guitar Văn Anh", "Thầy Văn Anh"],
          "inLanguage": "vi",
          "publisher": { "@id": "https://class.vananhaudio.com/#organization" }
        },
        {
          "@type": "EducationalOrganization",
          "@id": "https://class.vananhaudio.com/#organization",
          "name": "Thầy Văn Anh Guitar",
          "alternateName": ["Học Guitar Văn Anh", "Thầy Văn Anh"],
          "url": "https://class.vananhaudio.com/",
          "logo": "https://class.vananhaudio.com/tva-logo.png",
          "sameAs": ["https://zalo.me/vananhguitarist"]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
