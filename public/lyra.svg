<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Lyra">
  <!-- Lyra — nhân vật cô giáo piano của Piano Journey.
       Vẽ tay bằng SVG (không có trình sinh ảnh). Cố ý ĐƠN GIẢN vì hiển thị ở
       92px: mắt/miệng là những nét cong dày, đọc được ở cỡ nhỏ. Muốn thay bằng
       ảnh render thật thì thả public/lyra.png, HomeScreen tự ưu tiên file đó. -->
  <defs>
    <radialGradient id="nen" cx="34%" cy="26%" r="82%">
      <stop offset="0%"  stop-color="#FFF0DC"/>
      <stop offset="55%" stop-color="#FFD2A6"/>
      <stop offset="100%" stop-color="#F6A98C"/>
    </radialGradient>
    <linearGradient id="toc" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"  stop-color="#7A5646"/>
      <stop offset="100%" stop-color="#5A3D31"/>
    </linearGradient>
    <linearGradient id="ao" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#FFFDFB"/>
      <stop offset="100%" stop-color="#FDEDE2"/>
    </linearGradient>
    <clipPath id="vien">
      <circle cx="100" cy="100" r="99"/>
    </clipPath>
  </defs>

  <g clip-path="url(#vien)">
    <circle cx="100" cy="100" r="99" fill="url(#nen)"/>

    <!-- vai + áo -->
    <path d="M42 200c0-30 26-48 58-48s58 18 58 48z" fill="url(#ao)"/>
    <path d="M84 154c5 9 11 13 16 13s11-4 16-13l-16-6z" fill="#F7C9AC"/>

    <!-- cổ -->
    <path d="M86 128h28v22c0 8-28 8-28 0z" fill="#F3C1A2"/>

    <!-- tóc lớp sau -->
    <path d="M46 104c0-33 24-58 54-58s54 25 54 58c0 22-6 36-11 44-3-16 2-34-6-46-16 10-58 12-74-2-9 12-4 32-6 48-6-8-11-22-11-44z" fill="url(#toc)"/>

    <!-- mặt -->
    <ellipse cx="100" cy="100" rx="42" ry="45" fill="#FFDCC0"/>

    <!-- tóc mái -->
    <path d="M58 92c-1-27 18-46 42-46s43 19 42 46c-6-14-18-22-30-24-4 8-14 15-26 16-11 1-22-1-28 8z" fill="url(#toc)"/>

    <!-- tai -->
    <ellipse cx="58" cy="104" rx="7" ry="10" fill="#F7C9AC"/>
    <ellipse cx="142" cy="104" rx="7" ry="10" fill="#F7C9AC"/>

    <!-- má hồng -->
    <ellipse cx="74" cy="112" rx="11" ry="7" fill="#FF9CAE" opacity=".45"/>
    <ellipse cx="126" cy="112" rx="11" ry="7" fill="#FF9CAE" opacity=".45"/>

    <!-- mắt cười: nét cong dày, cỡ nhỏ vẫn thấy rõ -->
    <g fill="none" stroke="#4A3428" stroke-width="6" stroke-linecap="round">
      <path d="M72 99c4-6 12-6 16 0"/>
      <path d="M112 99c4-6 12-6 16 0"/>
      <!-- miệng cười -->
      <path d="M89 117c4 5 18 5 22 0" stroke-width="5"/>
    </g>

    <!-- nốt nhạc nhỏ bay bên cạnh -->
    <g transform="translate(150 46) rotate(-12)">
      <ellipse cx="0" cy="16" rx="8" ry="6" fill="#D97706"/>
      <rect x="6" y="-14" width="3.4" height="30" rx="1.7" fill="#D97706"/>
      <path d="M9.4 -14c8 3 12 7 12 14 0-4-5-8-12-9z" fill="#D97706"/>
    </g>
    <circle cx="38" cy="60" r="4" fill="#FFFFFF" opacity=".55"/>
    <circle cx="52" cy="44" r="2.6" fill="#FFFFFF" opacity=".45"/>
  </g>
</svg>
